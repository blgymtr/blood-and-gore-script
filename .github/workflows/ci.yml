name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests (synthetic project, never-square image test, safety rules)
        run: python -m unittest tests.test_bloodgore -v
      - name: No game or engine names anywhere (hashed deny list)
        run: python -m unittest tests.test_names -v
